<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0c0f14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="url(#amberGrad)" stroke-width="12" opacity="0.8"/>

  <!-- Glowing Amber Accent Dot -->
  <circle cx="410" cy="102" r="28" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Truck / Freight Emblem -->
  <g fill="url(#amberGrad)" transform="translate(64, 120)">
    <!-- Truck Cab & Trailer Silhouette -->
    <path d="M 40,200 L 220,200 L 220,60 L 40,60 Z" opacity="0.95"/>
    <path d="M 235,200 L 330,200 L 330,120 L 285,60 L 235,60 Z"/>
    
    <!-- Speed Lines / Freight Wings -->
    <path d="M 10,90 L 180,90 L 160,115 L 10,115 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 40,135 L 200,135 L 180,160 L 40,160 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Wheels -->
    <circle cx="100" cy="210" r="32" fill="#0c0f14" stroke="url(#amberGrad)" stroke-width="10"/>
    <circle cx="270" cy="210" r="32" fill="#0c0f14" stroke="url(#amberGrad)" stroke-width="10"/>
  </g>

  <!-- SW Initials Branding -->
  <text x="256" y="440" font-family="'Outfit', sans-serif" font-weight="900" font-size="72" fill="#ffffff" text-anchor="middle" letter-spacing="6">SHIPPING WISH</text>
</svg>
