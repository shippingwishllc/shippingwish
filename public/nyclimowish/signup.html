<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | NYC Limo Wish</title>
  <link rel="icon" href="/nyclimowish/favicon.ico" sizes="32x32">
  <link rel="icon" href="/nyclimowish/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/nyclimowish/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/limo.css">
</head>
<body class="limo-light" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
  <div class="limo-widget" style="max-width:420px;width:100%;background:#fff;border-color:#eee;color:#000;">
    <h1 style="text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:8px;">Create a customer account</h1>
    <p style="text-align:center;color:#666;font-size:0.9rem;margin-bottom:24px;">This is only for NYC Limo Wish passengers. Driver, operator, and staff logins are issued separately. Shipping Wish accounts are not used here.</p>
    <div id="alert" style="display:none;padding:12px;border-radius:8px;margin-bottom:16px;background:#fee;color:#c00;font-size:0.85rem;"></div>
    <form id="signup-form">
      <div class="limo-field"><label>Name</label><input class="limo-input" type="text" id="name" required style="background:#f9f9f9;color:#000;border-color:#ddd;padding-left:16px;"></div>
      <div class="limo-field"><label>Email</label><input class="limo-input" type="email" id="email" required style="background:#f9f9f9;color:#000;border-color:#ddd;padding-left:16px;"></div>
      <div class="limo-field"><label>Phone</label><input class="limo-input" type="tel" id="phone" style="background:#f9f9f9;color:#000;border-color:#ddd;padding-left:16px;"></div>
      <div class="limo-field"><label>Password</label><input class="limo-input" type="password" id="password" minlength="8" required style="background:#f9f9f9;color:#000;border-color:#ddd;padding-left:16px;"></div>
      <button type="submit" class="limo-btn limo-btn-dark limo-btn-block">Create account</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.85rem;color:#666;">Already registered? <a href="/login">Log in</a></p>
  </div>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/nyclimo/signup', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) {
        const el = document.getElementById('alert');
        el.textContent = data.error || 'Could not create the account';
        el.style.display = 'block';
        return;
      }
      window.location.href = '/passenger';
    });
  </script>
</body>
</html>
