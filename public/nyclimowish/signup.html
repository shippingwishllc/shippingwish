  <script>
  (function () {
    var host = location.hostname.toLowerCase();
    var limoHost = host === 'nyclimowish.com' || host === 'www.nyclimowish.com' || host.endsWith('.nyclimowish.com') || host === 'localhost' || host === '127.0.0.1';
    if (!limoHost) return;
    var path = location.pathname;
    if (path !== '/nyclimowish' && path.indexOf('/nyclimowish/') !== 0) return;
    var next = path.replace(/^\/nyclimowish/, '') || '/';
    next = next.replace(/\.html$/, '');
    if (next.endsWith('/index')) next = next.slice(0, -6) || '/';
    if (next.length > 1 && next.endsWith('/')) next = next.slice(0, -1);
    history.replaceState(null, '', next + location.search + location.hash);
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | NYC Limo Wish</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/nyclimowish/favicon.ico" sizes="32x32">
  <link rel="icon" href="/nyclimowish/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/nyclimowish/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/limo.css">
</head>
<body class="limo limo-join">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KCZSXZ6K"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <aside class="limo-join-photo" role="img" aria-label="Chauffeur holding the door of a black car"></aside>
  <main class="limo-join-panel">
    <div class="limo-join-card">
      <a href="/" class="limo-logo">NYC <span>LIMO</span> WISH</a>
      <div id="alert" class="limo-join-alert" role="alert"></div>
      <form id="signup-form">
        <div class="limo-join-grid">
          <div>
            <label class="limo-sr" for="first-name">First name</label>
            <input class="limo-input" id="first-name" autocomplete="given-name" placeholder="First Name" required>
          </div>
          <div>
            <label class="limo-sr" for="last-name">Last name</label>
            <input class="limo-input" id="last-name" autocomplete="family-name" placeholder="Last Name" required>
          </div>
          <div class="wide">
            <label class="limo-sr" for="email">Email address</label>
            <input class="limo-input" id="email" type="email" autocomplete="email" placeholder="Email Address" required>
          </div>
          <div class="wide limo-join-phone">
            <label class="limo-sr" for="phone-code">Country code</label>
            <select id="phone-code" aria-label="Country code">
              <option value="+1" selected>US +1</option>
              <option value="+44">UK +44</option>
              <option value="+971">UAE +971</option>
              <option value="+92">PK +92</option>
            </select>
            <label class="limo-sr" for="phone">Phone number</label>
            <input class="limo-input" id="phone" type="tel" autocomplete="tel-national" placeholder="Phone Number">
          </div>
          <div class="limo-join-pass">
            <label class="limo-sr" for="password">Password</label>
            <input class="limo-input" id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Password" required>
            <button type="button" class="limo-join-show" data-target="password">Show</button>
          </div>
          <div class="limo-join-pass">
            <label class="limo-sr" for="confirm">Confirm password</label>
            <input class="limo-input" id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm Password" required>
            <button type="button" class="limo-join-show" data-target="confirm">Show</button>
          </div>
          <div>
            <label class="limo-sr" for="company">Company name</label>
            <input class="limo-input" id="company" autocomplete="organization" placeholder="Company Name (Optional)">
          </div>
          <div>
            <label class="limo-sr" for="designation">Designation</label>
            <input class="limo-input" id="designation" autocomplete="organization-title" placeholder="Designation (Optional)">
          </div>
        </div>
        <label class="limo-join-check"><input type="checkbox" id="newsletter"> I want ride updates and offers</label>
        <div class="limo-join-honey" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit" class="limo-btn limo-btn-gold limo-btn-block" id="submit">Sign up</button>
      </form>
      <p class="limo-join-foot">I already have an account. <a href="/login">Log in now</a></p>
    </div>
  </main>
  <script>
  (function () {
    function showAlert(message) {
      const el = document.getElementById('alert');
      el.textContent = message || '';
      el.classList.toggle('show', Boolean(message));
    }

    document.querySelectorAll('.limo-join-show').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.target);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.textContent = show ? 'Hide' : 'Show';
      });
    });

    document.getElementById('signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        showAlert('Password and confirm password must match.');
        return;
      }
      const button = document.getElementById('submit');
      button.disabled = true;
      button.textContent = 'Creating account...';
      showAlert('');
      const phoneLocal = document.getElementById('phone').value.trim();
      const phone = phoneLocal ? document.getElementById('phone-code').value + ' ' + phoneLocal : '';
      try {
        const res = await fetch('/api/nyclimo/signup', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: document.getElementById('first-name').value,
            lastName: document.getElementById('last-name').value,
            email: document.getElementById('email').value,
            phone: phone,
            password: password,
            company: document.getElementById('company').value,
            designation: document.getElementById('designation').value,
            newsletter: document.getElementById('newsletter').checked,
            website: document.getElementById('website').value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not create the account');
        window.location.href = '/passenger';
      } catch (err) {
        showAlert(err.message || 'Could not create the account');
        button.disabled = false;
        button.textContent = 'Sign up';
      }
    });
  })();
  </script>
</body>
</html>
