  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Status | NYC Limo Wish</title>
  <link rel="icon" href="/nyclimowish/favicon.ico" sizes="32x32">
  <link rel="icon" href="/nyclimowish/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/nyclimowish/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/limo.css">
</head>
<body class="limo-light" style="text-align:center;padding:80px 24px;">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KCZSXZ6K"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="mark" style="font-size:4rem;margin-bottom:16px;">…</div>
  <h1 id="title" style="font-size:1.8rem;font-weight:800;margin-bottom:8px;">Checking payment</h1>
  <p id="message" style="color:#666;margin-bottom:8px;">We are confirming this checkout with Stripe.</p>
  <p id="booking-ref" style="font-weight:700;color:var(--limo-gold-dark);margin-bottom:32px;"></p>
  <a href="/track" class="limo-btn limo-btn-gold" style="margin-right:12px;">Track Your Ride</a>
  <a href="/" class="limo-btn limo-btn-outline" style="color:#666;border-color:#ddd;">Back to Home</a>
  <script>
    const params = new URLSearchParams(window.location.search);
    const booking = params.get('booking') || '';
    const sessionId = params.get('session_id') || '';
    if (booking) document.getElementById('booking-ref').textContent = booking;

    function show(mark, title, message) {
      document.getElementById('mark').textContent = mark;
      document.getElementById('title').textContent = title;
      document.getElementById('message').textContent = message;
    }

    (async () => {
      if (!booking) {
        show('!', 'No booking reference', 'Open the link from your checkout, or track the ride with your booking number.');
        return;
      }
      try {
        const qs = new URLSearchParams({ booking });
        if (sessionId) qs.set('session_id', sessionId);
        const res = await fetch('/api/nyclimo/bookings/confirm?' + qs.toString());
        const data = await res.json();
        if (!res.ok) {
          show('!', 'Payment not confirmed', data.error || 'We could not verify this payment.');
          return;
        }
        if (data.confirmed) {
          show('✅', 'Payment received', 'Your ride is confirmed with a licensed operator. A confirmation email is on its way.');
        } else {
          show('…', 'Payment not completed', 'This booking is ' + String(data.status || 'pending').replace(/_/g, ' ') + '. Payment status: ' + (data.payment_status || 'unpaid') + '.');
        }
      } catch (err) {
        show('!', 'Could not verify payment', 'Refresh this page in a moment, or track the ride with your booking number.');
      }
    })();
  </script>
</body>
</html>
