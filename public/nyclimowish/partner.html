<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYC Limo Wish Partner Portal</title>
<style>
:root{font-family:Arial,sans-serif;color:#15202b;background:#f4f6f8}body{margin:0}header{background:#081226;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1000px;margin:32px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin:18px 0}.muted{color:#64748b}.card{border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.actions{display:flex;gap:8px;margin-top:12px}button{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer;background:#10213d;color:#fff}button.secondary{background:#e8edf4;color:#10213d}button:disabled{opacity:.55;cursor:wait}.notice{padding:12px;background:#fef3c7;border-radius:8px;color:#78350f}#error{color:#b91c1c}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}
</style>
</head>
<body>
<header><strong>NYC Limo Wish · Partner Portal</strong><button id="logout" class="secondary">Sign out</button></header>
<main>
<section class="panel"><h1>Operator dashboard</h1><p id="welcome" class="muted">Loading your secure partner account…</p><p id="error"></p>
<label><input id="available" type="checkbox"> Available for new ride offers</label>
<p id="availability-note" class="muted">Availability is used only for new offers. Keep your TLC base and insurance details current with NYC Limo Wish.</p>
</section>
<section class="panel"><h2>New offers</h2><div id="offers"><p class="muted">Loading offers…</p></div></section>
<section class="panel"><h2>Accepted and paid rides</h2><div id="bookings"><p class="muted">Loading assigned rides…</p></div></section>
</main>
<script src="/js/limo-partner.js"></script>
</body></html>
