<header><strong>NYC Limo Wish · Partner Portal</strong><button id="logout" class="secondary">Sign out</button></header>
<main>
<section class="panel"><h1>Operator dashboard</h1><p id="welcome" class="muted">Loading your secure partner account…</p><p id="error"></p>
<label><input id="available" type="checkbox"> Available for new ride offers</label>
<p id="availability-note" class="muted">Availability is used only for new offers. Keep your TLC base and insurance details current with NYC Limo Wish.</p>
</section>
<section class="panel"><h2>New offers</h2><div id="offers"><p class="muted">Loading offers…</p></div></section>
<section class="panel"><h2>Accepted and paid rides</h2><div id="bookings"><p class="muted">Loading assigned rides…</p></div></section>
