<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NYC Limo Wish</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/limo.css">
</head>
<body class="limo-light" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
  <div class="limo-widget" style="max-width:420px;width:100%;background:#fff;border-color:#eee;color:#000;">
    <h1 style="text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:8px;">Login</h1>
    <p style="text-align:center;color:#666;font-size:0.9rem;margin-bottom:24px;">Book and manage your premium rides</p>
    <div id="alert" style="display:none;padding:12px;border-radius:8px;margin-bottom:16px;background:#fee;color:#c00;font-size:0.85rem;"></div>
    <form id="login-form">
      <div class="limo-field"><label>Email</label><input class="limo-input" type="email" id="email" required style="background:#f9f9f9;color:#000;border-color:#ddd;padding-left:16px;"></div>
      <div class="limo-field"><label>Password</label><input class="limo-input" type="password" id="password" required style="background:#f9f9f9;color:#000;border-color:#ddd;padding-left:16px;"></div>
      <button type="submit" class="limo-btn limo-btn-dark limo-btn-block">Login</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.85rem;color:#666;">No account? <a href="/signup">Create one</a></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/nyclimo/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (!res.ok) {
        const el = document.getElementById('alert');
        el.textContent = data.error || 'Login failed';
        el.style.display = 'block';
        return;
      }
      window.location.href = params.get('redirect') || (data.user.role === 'admin' || data.user.role === 'dispatcher' ? '/erp' : (data.user.role === 'partner_dispatcher' ? '/partner' : '/passenger'));
    });
  </script>
</body>
</html>
