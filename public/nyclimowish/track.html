  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Ride | NYC Limo Wish</title>
  <link rel="icon" href="/nyclimowish/favicon.ico" sizes="32x32">
  <link rel="icon" href="/nyclimowish/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/nyclimowish/apple-touch-icon.png">

</head>
<body class="limo">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KCZSXZ6K"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

<nav class="limo-nav"><div class="limo-nav-inner"><a href="/" class="limo-logo">NYC <span>LIMO</span> WISH</a></div></nav>
<div style="max-width:560px;margin:120px auto;padding:0 24px;">
  <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:8px;text-align:center;">Track Your Ride</h1>
  <p style="color:var(--limo-gray);text-align:center;margin-bottom:32px;">Enter your booking number to see real-time status</p>
  <div class="limo-widget">
    <div class="limo-field"><label>Booking Number</label><input class="limo-input" id="track-num" placeholder="NLW-..." style="padding-left:16px;"></div>
    <button class="limo-btn limo-btn-gold limo-btn-block" id="track-btn">Track Ride</button>
  </div>
  <div id="track-result" style="margin-top:24px;"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get('ref')) document.getElementById('track-num').value = params.get('ref');
document.getElementById('track-btn').addEventListener('click', async () => {
  const num = document.getElementById('track-num').value.trim();
  if (!num) return;
  const res = await fetch('/api/nyclimo/track/' + encodeURIComponent(num));
  const data = await res.json();
  const el = document.getElementById('track-result');
  if (!res.ok) { el.innerHTML = '<p style="color:#ef4444;text-align:center;">Booking not found</p>'; return; }
  const b = data.booking;
  const esc = (v) => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  
  const badges = [];
  if (b.flight_number) badges.push(`<span style="background:rgba(56,189,248,0.2);color:#38bdf8;padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:700;">✈ Flight: ${esc(b.flight_number)}</span>`);
  if (b.meet_and_greet) badges.push('<span style="background:rgba(201,162,39,0.2);color:var(--limo-gold);padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:700;">🪧 VIP Meet &amp; Greet</span>');
  if (Number(b.child_seats) > 0) badges.push(`<span style="background:rgba(168,85,247,0.2);color:#c084fc;padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:700;">👶 ${b.child_seats} Child Seat(s)</span>`);

  el.innerHTML = `<div class="limo-widget">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <strong>${esc(b.booking_number)}</strong>
      <span style="color:var(--limo-gold);font-weight:700;font-size:0.85rem;">${esc(b.status.replaceAll('_', ' ').toUpperCase())}</span>
    </div>
    ${badges.length ? `<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">${badges.join('')}</div>` : ''}
    <div style="border-top:1px solid rgba(255,255,255,0.08);margin-top:12px;padding-top:12px;">
      <p style="font-size:0.9rem;">📍 <strong>Pickup:</strong> ${esc(b.pickup_address)}</p>
      ${b.dropoff_address ? `<p style="font-size:0.9rem;margin-top:6px;">📍 <strong>Drop-off:</strong> ${esc(b.dropoff_address)}</p>` : ''}
      <p style="font-size:0.9rem;margin-top:6px;">📅 ${esc(b.pickup_date)} at ${esc(b.pickup_time)}</p>
      <p style="font-size:0.9rem;margin-top:6px;">🚗 <strong>Vehicle:</strong> ${esc(b.vehicle_name || 'Standard')}</p>
      ${b.operator_name ? `<p style="font-size:0.9rem;margin-top:6px;">🏢 <strong>Operator:</strong> ${esc(b.operator_name)}</p>` : ''}
      <p style="font-size:0.9rem;margin-top:6px;">💰 <strong>Total:</strong> $${esc(parseFloat(b.total_price).toFixed(2))} (${esc(b.payment_status)})</p>
    </div>
    ${data.history?.length ? '<div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">' +
      data.history.map((h) => `<p style="font-size:0.8rem;color:var(--limo-gray);margin:4px 0;">${esc(h.status.replaceAll('_', ' '))} — ${new Date(h.created_at).toLocaleString()}</p>`).join('') + '</div>' : ''}
  </div>`;
});
if (params.get('ref')) document.getElementById('track-btn').click();
</script>
</body>
</html>
