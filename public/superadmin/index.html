<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting — Shipping Wish Command Center</title>
  <style>
    body { margin: 0; font-family: Inter, sans-serif; background: #0b1528; color: #f8fafc; display: grid; place-items: center; min-height: 100vh; }
    .msg { font-size: 14px; font-weight: 600; opacity: .85; }
  </style>
</head>
<body>
  <div class="msg">Verifying executive session...</div>
  <script>
    fetch('/api/me', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.user && d.user.role === 'super_admin') {
          window.location.replace('/superadmin-command');
        } else if (d && d.user) {
          window.location.replace('/dispatcher-dashboard');
        } else {
          window.location.replace('/admin');
        }
      })
      .catch(function () {
        window.location.replace('/admin');
      });
  </script>
</body>
</html>
