<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe | Shipping Wish LLC</title>
  <link rel="stylesheet" href="/css/design-system.css">
</head>
<body style="background:#f4f6f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:520px;background:#fff;border:1px solid #e2e8f0;padding:40px;text-align:center;">
    <p style="letter-spacing:0.14em;text-transform:uppercase;font-size:12px;color:#d97706;font-weight:700;margin:0 0 12px;">Shipping Wish LLC</p>
    <h1 id="heading" style="font-size:24px;margin:0 0 12px;">Unsubscribe</h1>
    <p id="msg" style="color:#475569;line-height:1.6;">Processing your request…</p>
    <p style="font-size:13px;color:#64748b;margin-top:24px;">19266 Coastal Hwy, Rehoboth Beach, DE 19971 · +1 (917) 737-0021</p>
  </div>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const t = params.get('t') || params.get('token');
      const res = await fetch('/api/email/unsubscribe?t=' + encodeURIComponent(t || ''), { method: 'GET' });
      const data = await res.json().catch(() => ({}));
      const heading = document.getElementById('heading');
      const msg = document.getElementById('msg');
      if (res.ok) {
        heading.textContent = 'You are unsubscribed';
        msg.textContent = 'We will not send further operations emails to this address. You can still call +1 (917) 737-0021 if you need us.';
      } else {
        heading.textContent = 'Link not valid';
        msg.textContent = data.error || 'This unsubscribe link is missing or expired.';
      }
    })();
  </script>
</body>
</html>
