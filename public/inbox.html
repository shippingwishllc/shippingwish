<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrier Replies Inbox | Shipping Wish TMS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/design-system.css?v=20">
  <style>
    :root {
      --inbox-page-items: 7;
      --inbox-item-h: 84px;
      --inbox-item-gap: 8px;
      --inbox-list-h: calc(var(--inbox-page-items) * var(--inbox-item-h) + (var(--inbox-page-items) - 1) * var(--inbox-item-gap));
      --inbox-pane-h: calc(var(--inbox-list-h) + 52px);
    }
    .inbox-layout { display:grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr); gap:16px; align-items:stretch; }
    @media (max-width: 900px) { .inbox-layout { grid-template-columns: 1fr; } }
    .inbox-list-col { display:flex; flex-direction:column; min-height:0; }
    .inbox-list-card {
      display:flex; flex-direction:column; padding:12px;
      height:var(--inbox-pane-h); min-height:var(--inbox-pane-h); max-height:var(--inbox-pane-h);
      overflow:hidden;
      background: #ffffff;
      border: 1px solid var(--border-default, #e2e8f0);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    #inbox-list {
      display:flex; flex-direction:column; gap:var(--inbox-item-gap);
      height:var(--inbox-list-h); min-height:var(--inbox-list-h); max-height:var(--inbox-list-h);
      overflow:hidden; flex-shrink:0;
    }
    .inbox-pagination {
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      padding-top:10px; margin-top:auto; border-top:1px solid var(--border-default, #e2e8f0);
      font-size:12px; color:var(--text-muted); flex-wrap:wrap; flex-shrink:0;
    }
    .inbox-pagination .pager-btns { display:flex; gap:8px; }
    .inbox-item {
      border:1px solid var(--border-default, #e2e8f0); border-radius:12px; padding:10px 14px;
      cursor:pointer; text-align:left; background:#ffffff; width:100%;
      height:var(--inbox-item-h); min-height:var(--inbox-item-h); max-height:var(--inbox-item-h);
      overflow:hidden; flex-shrink:0;
      transition: all 0.15s ease;
    }
    .inbox-item-preview {
      font-size:12px; color:#64748b; margin-top:4px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .inbox-item:hover { border-color: var(--color-amber-500, #f59e0b); box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05); }
    .inbox-item.active { border-color: var(--color-amber-500, #f59e0b); background: #fffbeb; box-shadow: 0 0 0 1px #f59e0b; }
    .inbox-item.unread { background: #fefce8; border-left: 3.5px solid #d97706; }
    .msg-panel {
      border:1px solid var(--border-default, #e2e8f0); border-radius:12px;
      height:var(--inbox-pane-h); min-height:var(--inbox-pane-h); max-height:var(--inbox-pane-h);
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      display:flex; flex-direction:column; overflow:hidden; padding:16px;
    }
    .msg-panel-empty {
      margin:auto; text-align:center; color:#64748b; padding:24px; font-size:14px;
    }
    .msg-panel-header { flex-shrink:0; margin-bottom:10px; }
    .msg-scroll-area {
      flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
      padding-right:4px;
    }
    .contact-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:8px 14px; margin:0 0 12px; padding:12px; border-radius:10px; background: #f8fafc; font-size:12px; }
    .contact-grid strong { display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color: #64748b; margin-bottom:2px; }
    .msg-body { white-space:pre-wrap; font-size:14px; line-height:1.65; margin:0; color:#0f172a; }
    .attach-list { display:flex; flex-direction:column; gap:8px; margin:0 0 12px; padding:10px; border-radius:10px; background:#fffbeb; border:1px solid #fde68a; }
    .attach-item { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:13px; color:#0f172a; }
    .reply-box { flex-shrink:0; margin-top:10px; padding-top:12px; border-top:1.5px solid var(--border-default, #e2e8f0); }
    .reply-box textarea { width:100%; min-height:88px; max-height:120px; border-radius:10px; border:1.5px solid #cbd5e1; background:#ffffff; color:#0f172a; padding:10px 12px; font-family:inherit; font-size:14px; resize:vertical; box-sizing:border-box; }
    .reply-box textarea:focus { outline:none; border-color:#2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .reply-from-note { font-size:11.5px; color:#64748b; margin:0 0 8px; }
    .inbox-kpi-row { display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
    .inbox-kpi-card { background:#ffffff; border:1px solid var(--border-default, #e2e8f0); border-radius:12px; padding:12px 20px; display:flex; align-items:center; gap:14px; box-shadow:0 1px 3px rgba(15,23,42,0.04); min-width:180px; }
    .inbox-kpi-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .inbox-kpi-icon.unread { background:rgba(245,158,11,0.12); color:#d97706; }
    .inbox-kpi-icon.total { background:rgba(37,99,235,0.1); color:#2563eb; }
    .inbox-kpi-val { font-size:24px; font-weight:800; color:#0f172a; line-height:1.1; }
    .inbox-kpi-label { font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }
    @media (max-width: 900px) {
      .inbox-list-card, .msg-panel { height:auto; min-height:auto; max-height:none; }
      #inbox-list { height:auto; min-height:auto; max-height:none; overflow:visible; }
      .inbox-item { height:auto; min-height:84px; max-height:none; }
    }
    .inbox-page-content {
      padding-top: var(--space-6);
      padding-bottom: var(--space-6);
    }
  </style>
</head>
<body class="app-body">
<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar" role="navigation" aria-label="Portal navigation"></aside>
  <script src="/js/app-shell-boot.js"></script>

  <div class="app-main">
    <header class="app-header">
      <div>
        <h1 style="font-size:var(--text-lg);font-weight:800;margin:0;">📧 Freight Email Center</h1>
        <p style="font-size:var(--text-xs);color:var(--text-muted);margin:0;">Inbound carrier replies, outbound outreach, and dispatch dispatches.</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary btn-sm" type="button" onclick="openComposeModal()" style="font-weight:800;">✏️ Compose Email</button>
        <button class="btn btn-primary btn-sm" type="button" id="btn-folder-inbound" onclick="loadInbox(false, 1, 'inbound')" style="font-weight:700;">📥 Inbox</button>
        <button class="btn btn-secondary btn-sm" type="button" id="btn-folder-outbound" onclick="loadInbox(false, 1, 'outbound')">📤 Sent</button>
        <button class="btn btn-secondary btn-sm" type="button" id="btn-folder-all" onclick="loadInbox(false, 1, 'all')">📋 All Mail</button>
        <button class="btn btn-secondary btn-sm" type="button" id="btn-folder-unread" onclick="loadInbox(true, 1, 'inbound')">📬 Unread</button>
        <a href="/trash" class="btn btn-secondary btn-sm" id="inbox-trash-link" style="display:none;">🗑️ Trash</a>
      </div>
    </header>
    <main class="app-content inbox-page-content">
      <div class="inbox-kpi-row">
        <div class="inbox-kpi-card">
          <div class="inbox-kpi-icon unread">📬</div>
          <div>
            <div class="inbox-kpi-val" id="kpi-unread">0</div>
            <div class="inbox-kpi-label">Unread replies</div>
          </div>
        </div>
        <div class="inbox-kpi-card">
          <div class="inbox-kpi-icon total">✉️</div>
          <div>
            <div class="inbox-kpi-val" id="kpi-total">0</div>
            <div class="inbox-kpi-label">Total Loaded</div>
          </div>
        </div>
      </div>
      <div class="inbox-layout">
        <div class="inbox-list-col">
          <div class="tms-table-card inbox-list-card">
            <div id="inbox-list">
              <p class="text-muted" style="padding:24px;text-align:center;">Loading inbox…</p>
            </div>
            <div class="inbox-pagination" id="inbox-pagination" style="display:none;">
              <span id="inbox-page-info">—</span>
              <div class="pager-btns">
                <button type="button" class="btn btn-secondary btn-sm" id="inbox-prev-btn" onclick="goInboxPage(-1)">← Previous</button>
                <button type="button" class="btn btn-secondary btn-sm" id="inbox-next-btn" onclick="goInboxPage(1)">Next →</button>
              </div>
            </div>
          </div>
        </div>
        <div class="msg-panel" id="msg-panel">
          <p class="msg-panel-empty">Select a reply on the left to open it.</p>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
(function () {
  const INBOX_PAGE_SIZE = 7;
  let messagesCache = [];
  let selectedId = null;
  let currentPage = 1;
  let totalPages = 1;
  let totalMessages = 0;
  let unreadOnlyFilter = false;
  let IS_ADMIN = false;

  async function checkAuth() {
    const res = await fetch('/api/me', { credentials: 'include' });
    if (!res.ok) {
      window.location.href = '/login';
      return;
    }
    const data = await res.json();
    const role = data.user && data.user.role;
    if (role === 'carrier' || role === 'carrier_admin' || role === 'driver') {
      window.location.href = '/carrier-overview';
    }
    IS_ADMIN = role === 'admin' || role === 'super_admin';
    const trashLink = document.getElementById('inbox-trash-link');
    if (trashLink) trashLink.style.display = IS_ADMIN ? '' : 'none';
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function previewText(m) {
    const t = (m.body_text || '').trim();
    if (t) return t.slice(0, 120);
    if (m.body_html) return '(HTML email — open to read)';
    return 'No body yet — open to load from Resend';
  }

  function contactTitle(m) {
    return m.company_name || m.owner_name || m.from_email || 'Unknown sender';
  }

  function renderInboxList() {
    const list = document.getElementById('inbox-list');
    if (!messagesCache.length) {
      list.innerHTML = '<p class="text-muted" style="padding:32px;text-align:center;">No carrier emails on this page. Try Previous or show all messages.</p>';
      return;
    }
    list.innerHTML = messagesCache.map(m => `
      <button type="button" class="inbox-item ${m.is_read ? '' : 'unread'} ${selectedId === m.id ? 'active' : ''}" onclick="openMessage(${m.id})">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
          <div style="font-weight:800;display:flex;align-items:center;gap:6px;">
            ${m.direction === 'outbound' ? '<span class="badge badge-paid" style="font-size:9px;padding:2px 6px;">↗ Sent</span>' : '<span class="badge badge-booked" style="font-size:9px;padding:2px 6px;">📥 Inbound</span>'}
            <span>${escapeHtml(contactTitle(m))}</span>
          </div>
          <div style="font-size:11px;color:var(--text-muted);">${new Date(m.created_at).toLocaleString()}</div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${escapeHtml(m.peer_email || m.from_email || '')}</div>
        <div style="font-size:13px;margin-top:6px;font-weight:600;">${escapeHtml(m.subject || '(no subject)')}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;" class="inbox-item-preview">${escapeHtml(previewText(m))}</div>
      </button>
    `).join('');
  }

  function renderPagination() {
    const pager = document.getElementById('inbox-pagination');
    const info = document.getElementById('inbox-page-info');
    const prevBtn = document.getElementById('inbox-prev-btn');
    const nextBtn = document.getElementById('inbox-next-btn');
    if (!pager || !info) return;

    if (totalMessages === 0) {
      pager.style.display = 'none';
      return;
    }

    pager.style.display = 'flex';
    const start = (currentPage - 1) * INBOX_PAGE_SIZE + 1;
    const end = Math.min(currentPage * INBOX_PAGE_SIZE, totalMessages);
    info.textContent = `${start}–${end} of ${totalMessages} · Page ${currentPage} of ${totalPages}`;

    if (prevBtn) {
      prevBtn.disabled = currentPage <= 1;
      prevBtn.style.opacity = currentPage <= 1 ? '0.5' : '';
      prevBtn.style.cursor = currentPage <= 1 ? 'not-allowed' : '';
    }
    if (nextBtn) {
      nextBtn.disabled = currentPage >= totalPages;
      nextBtn.style.opacity = currentPage >= totalPages ? '0.5' : '';
      nextBtn.style.cursor = currentPage >= totalPages ? 'not-allowed' : '';
    }
  }

  function goInboxPage(delta) {
    const next = currentPage + delta;
    if (next < 1 || next > totalPages) return;
    loadInbox(unreadOnlyFilter, next);
  }

  let currentDirection = 'inbound';

  async function loadInbox(unreadOnly, page, direction) {
    if (typeof unreadOnly === 'boolean') {
      if (page === undefined) currentPage = 1;
      unreadOnlyFilter = unreadOnly;
    }
    if (page !== undefined) currentPage = page;
    if (currentPage < 1) currentPage = 1;
    if (direction !== undefined) currentDirection = direction;

    // Update active folder tabs
    ['inbound', 'outbound', 'all', 'unread'].forEach(d => {
      const btn = document.getElementById('btn-folder-' + d);
      if (btn) {
        const isAct = (d === 'unread' && unreadOnlyFilter) || (d === currentDirection && !unreadOnlyFilter);
        if (isAct) {
          btn.classList.remove('btn-secondary');
          btn.classList.add('btn-primary');
        } else {
          btn.classList.remove('btn-primary');
          btn.classList.add('btn-secondary');
        }
      }
    });

    const qs = new URLSearchParams({
      perPage: String(INBOX_PAGE_SIZE),
      page: String(currentPage)
    });
    if (unreadOnlyFilter) qs.set('unread', '1');
    if (currentDirection) qs.set('direction', currentDirection);

    try {
      const res = await fetch('/api/email/inbox?' + qs.toString(), { credentials: 'include' });
      const data = await res.json();
      document.getElementById('kpi-unread').textContent = data.unread || 0;
      messagesCache = data.messages || [];
      totalMessages = data.total || messagesCache.length;
      totalPages = data.totalPages || 1;
      currentPage = data.page || currentPage;

      document.getElementById('kpi-total').textContent = totalMessages;

      const list = document.getElementById('inbox-list');
      if (totalMessages === 0) {
        list.innerHTML = '<p class="text-muted" style="padding:32px;text-align:center;">No carrier replies yet. When a carrier replies to operations@ or your outreach, it will appear here.</p>';
        document.getElementById('inbox-pagination').style.display = 'none';
        document.getElementById('msg-panel').innerHTML = '<p class="text-muted" style="margin:0;">No messages.</p>';
        selectedId = null;
        return;
      }

      renderInboxList();
      renderPagination();

      if (selectedId && messagesCache.some(m => m.id === selectedId)) {
        openMessage(selectedId);
      }
    } catch (err) {
      console.error('Inbox load error:', err);
      const list = document.getElementById('inbox-list');
      if (list) {
        list.innerHTML = '<p class="text-muted" style="padding:24px;text-align:center;">Could not load inbox. <button class="btn btn-secondary btn-sm" type="button" onclick="loadInbox(false)">Retry</button></p>';
      }
    }
  }

  let currentOpenedMessage = null;

  async function openMessage(id) {
    selectedId = id;
    document.querySelectorAll('.inbox-item').forEach(el => el.classList.remove('active'));
    const btn = Array.from(document.querySelectorAll('.inbox-item')).find(el => el.getAttribute('onclick') === 'openMessage(' + id + ')');
    if (btn) btn.classList.add('active');

    const panel = document.getElementById('msg-panel');
    panel.innerHTML = '<p class="text-muted" style="margin:0;">Loading message…</p>';

    const res = await fetch('/api/email/inbox/' + id, { credentials: 'include' });
    const data = await res.json();
    if (!res.ok || !data.message) {
      panel.innerHTML = '<p style="color:#b91c1c;margin:0;">' + escapeHtml(data.error || 'Could not open message') + '</p>';
      return;
    }
    const m = data.message;
    currentOpenedMessage = m;

    // Mark read when opened
    if (!m.is_read) {
      fetch('/api/email/inbox/' + id + '/read', { method: 'POST', credentials: 'include' }).then(() => {
        const cached = messagesCache.find(x => x.id === id);
        if (cached) cached.is_read = true;
        const unreadEl = document.getElementById('kpi-unread');
        const n = Math.max(0, parseInt(unreadEl.textContent, 10) - 1);
        unreadEl.textContent = String(n);
      });
    }

    const bodyText = (m.body_text || '').trim();
    const hasHtml = Boolean((m.body_html || '').trim());
    const mailto = m.from_email ? `mailto:${encodeURIComponent(m.from_email)}?subject=${encodeURIComponent('Re: ' + (m.subject || ''))}` : '#';
    const matchedLead = m.lead_id
      ? `<a href="/crm-sales?lead=${m.lead_id}">Lead #${m.lead_id} — open in Sales CRM</a>`
      : 'Not in CRM yet';

    const attachments = Array.isArray(m.attachments) ? m.attachments : [];
    const replyFrom = m.to_email || 'operations@shippingwish.com';
    const attachHtml = attachments.length ? `
      <div class="attach-list">
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:4px;">Attachments (${attachments.length})</div>
        ${attachments.map(a => `
          <div class="attach-item">
            <span>📎 ${escapeHtml(a.filename || 'file')}${a.size ? ` <span style="color:var(--text-muted);">(${Math.round(a.size / 1024)} KB)</span>` : ''}</span>
            <a class="btn btn-secondary btn-sm" href="/api/email/inbox/${m.id}/attachments/${encodeURIComponent(a.id)}/download" download>Download</a>
          </div>
        `).join('')}
      </div>` : '';

    const isOutbound = m.direction === 'outbound';
    const dirBadge = isOutbound
      ? '<span class="badge badge-paid" style="font-size:11px;padding:3px 8px;">↗ Outbound Email Sent</span>'
      : '<span class="badge badge-booked" style="font-size:11px;padding:3px 8px;">📥 Inbound Reply Received</span>';

    panel.innerHTML = `
      <div class="msg-panel-header">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
              ${dirBadge}
              <span style="font-size:11px;color:var(--text-muted);">${new Date(m.created_at).toLocaleString()}</span>
            </div>
            <h2 style="margin:0;font-size:17px;font-weight:800;color:var(--text-primary);">${escapeHtml(m.subject || '(no subject)')}</h2>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a class="btn btn-secondary btn-sm" href="${mailto}">Open in mail app</a>
            ${IS_ADMIN ? `<button type="button" class="btn btn-light btn-sm" style="color:#b91c1c;" onclick="trashEmail(${m.id})">Move to trash</button>` : ''}
          </div>
        </div>
      </div>

      <div class="msg-scroll-area">
        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;font-size:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid #e2e8f0;padding-bottom:8px;">
            <div>
              <strong style="color:#64748b;text-transform:uppercase;font-size:10px;letter-spacing:0.04em;">Carrier / Recipient</strong>
              <div style="font-size:15px;font-weight:800;color:#d97706;margin-top:2px;">
                ${escapeHtml(m.company_name || m.owner_name || m.peer_name || 'Carrier')} ${m.mc_number ? `<span style="font-size:12px;color:#64748b;">(${escapeHtml(m.mc_number)})</span>` : ''}
              </div>
            </div>
            <div>
              ${matchedLead}
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:8px;color:#64748b;">
            <div><strong style="color:#475569;">From:</strong> <span style="color:#0f172a;font-weight:600;">${escapeHtml(m.from_email || 'operations@shippingwish.com')}</span></div>
            <div><strong style="color:#475569;">To:</strong> <span style="color:#0f172a;font-weight:600;">${escapeHtml(m.peer_email || m.to_email || '—')}</span></div>
            <div><strong style="color:#475569;">Phone:</strong> ${m.phone ? `<a href="tel:${escapeHtml(m.phone)}" style="color:#2563eb;font-weight:600;">${escapeHtml(m.phone)}</a>` : '—'}</div>
            <div><strong style="color:#475569;">Sales Rep:</strong> <span style="color:#0f172a;font-weight:600;">${escapeHtml(m.sales_rep_name || 'Unassigned')}</span></div>
          </div>
        </div>

        ${attachHtml}

        <div style="background:#ffffff;border:1.5px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,0.04);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f1f5f9;">
            <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#64748b;">Email Message Body</span>
            ${hasHtml && bodyText ? `
              <div style="display:flex;gap:6px;">
                <button type="button" class="btn btn-secondary btn-sm" id="btn-fmt-html-${m.id}" style="font-size:11px;padding:2px 8px;background:#0f172a;color:#fff;" onclick="toggleEmailFormat(${m.id}, 'html')">Formatted</button>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-fmt-text-${m.id}" style="font-size:11px;padding:2px 8px;" onclick="toggleEmailFormat(${m.id}, 'text')">Plain text</button>
              </div>` : ''}
          </div>
          <div id="email-content-box-${m.id}">
            ${hasHtml ? `
              <iframe id="email-frame-${m.id}" style="width:100%;border:none;min-height:220px;background:#ffffff;display:block;" srcdoc="${escapeHtml(sanitizeIframeHtml(m.body_html))}" onload="autoResizeIframe(this)"></iframe>
            ` : (bodyText ? `
              <div style="white-space:pre-wrap;font-family:inherit;font-size:13.5px;line-height:1.65;color:#0f172a;word-break:break-word;">${escapeHtml(bodyText)}</div>
            ` : `
              <p style="color:#64748b;font-style:italic;margin:0;">(Empty message body)</p>
            `)}
          </div>
        </div>
      </div>

      <div class="reply-box">
        <h3 style="margin:0 0 6px;font-size:14px;font-weight:700;color:#0f172a;">Reply from portal</h3>
        <p class="reply-from-note" style="font-size:11.5px;color:#64748b;margin:0 0 8px;">Reply will send from <strong style="color:#0f172a;">${escapeHtml(replyFrom)}</strong> to <strong style="color:#0f172a;">${escapeHtml(m.peer_email || m.from_email || '')}</strong> (same thread).</p>
        <textarea id="reply-text-${m.id}" placeholder="Type your reply to carrier…" style="width:100%;min-height:84px;border:1.5px solid #cbd5e1;border-radius:10px;padding:12px;font-family:inherit;font-size:14px;box-sizing:border-box;color:#0f172a;background:#ffffff;"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-primary btn-sm" onclick="sendReply(${m.id})">Send reply</button>
        </div>
      </div>
    `;
  }

  async function sendReply(id) {
    const ta = document.getElementById('reply-text-' + id);
    const message = (ta && ta.value || '').trim();
    if (!message) {
      alert('Write a reply message first.');
      return;
    }
    if (!confirm('Send this reply from the inbox address shown above?')) return;
    const res = await fetch('/api/email/inbox/' + id + '/reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ message })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert([data.error || 'Could not send reply', data.hint].filter(Boolean).join('\n\n'));
      return;
    }
    alert(data.message || 'Reply sent');
    if (ta) ta.value = '';
  }

  function stripHtml(html) {
    const d = document.createElement('div');
    d.innerHTML = String(html || '');
    return (d.textContent || d.innerText || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  async function trashEmail(id) {
    if (!confirm('Move this email to Trash? Only admins can restore from the Trash page.')) return;
    const res = await fetch('/api/email/inbox/' + id, { method: 'DELETE', credentials: 'include' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert(data.error || 'Could not move to trash.');
      return;
    }
    if (selectedId === id) {
      selectedId = null;
      document.getElementById('msg-panel').innerHTML = '<p class="text-muted" style="margin:0;">Select a reply on the left.</p>';
    }
    loadInbox(unreadOnlyFilter);
    if (IS_ADMIN) {
      alert('Email moved to Trash. Click the 🗑️ Trash button (top right) or sidebar → Trash to restore.');
    }
  }

  function sanitizeIframeHtml(html) {
    if (!html) return '';
    const clean = String(html).replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
    const baseStyle = `<style>
      html, body {
        background-color: #ffffff !important;
        color: #0f172a !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        font-size: 14px !important;
        line-height: 1.6 !important;
        margin: 0 !important;
        padding: 8px 12px !important;
        word-break: break-word !important;
      }
      a { color: #2563eb !important; text-decoration: underline; }
      img { max-width: 100% !important; height: auto !important; }
      table { max-width: 100% !important; }
      blockquote { border-left: 3px solid #cbd5e1 !important; margin: 8px 0 !important; padding-left: 12px !important; color: #475569 !important; }
    </style>`;
    return baseStyle + clean;
  }

  function autoResizeIframe(iframe) {
    try {
      if (!iframe) return;
      const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
      if (doc && doc.body) {
        const height = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 200);
        iframe.style.height = (height + 24) + 'px';
      }
    } catch (e) {
      iframe.style.height = '420px';
    }
  }

  function toggleEmailFormat(id, mode) {
    const box = document.getElementById('email-content-box-' + id);
    const btnHtml = document.getElementById('btn-fmt-html-' + id);
    const btnText = document.getElementById('btn-fmt-text-' + id);
    if (!box || !currentOpenedMessage || currentOpenedMessage.id !== id) return;

    if (mode === 'html') {
      if (btnHtml) { btnHtml.style.background = '#0f172a'; btnHtml.style.color = '#fff'; }
      if (btnText) { btnText.style.background = ''; btnText.style.color = ''; }
      box.innerHTML = `
        <iframe id="email-frame-${id}" style="width:100%;border:none;min-height:220px;background:#ffffff;display:block;" srcdoc="${escapeHtml(sanitizeIframeHtml(currentOpenedMessage.body_html))}" onload="autoResizeIframe(this)"></iframe>
      `;
    } else {
      if (btnText) { btnText.style.background = '#0f172a'; btnText.style.color = '#fff'; }
      if (btnHtml) { btnHtml.style.background = ''; btnHtml.style.color = ''; }
      const txt = (currentOpenedMessage.body_text || '').trim();
      box.innerHTML = `
        <div style="white-space:pre-wrap;font-family:inherit;font-size:13.5px;line-height:1.65;color:#0f172a;word-break:break-word;">${escapeHtml(txt || '(No plain text available)')}</div>
      `;
    }
  }

  window.openComposeModal = function () {
    document.getElementById('modal-compose-email').style.display = 'flex';
  };

  window.closeComposeModal = function () {
    document.getElementById('modal-compose-email').style.display = 'none';
  };

  window.applyEmailTemplate = function (val) {
    const subj = document.getElementById('compose-subject');
    const body = document.getElementById('compose-body');
    if (!subj || !body) return;

    if (val === 'trial') {
      subj.value = '7-Day Zero-Risk Dispatch Free Trial ($0 Today) — Shipping Wish LLC';
      body.value = `Hello Fleet Owner,\n\nWe wanted to introduce our dedicated 24/7 truck dispatch operations at Shipping Wish LLC.\n\nKey Highlights:\n- We assign a dedicated personal dispatcher to your equipment.\n- You keep 100% of your freight payments — ZERO percentage taken!\n- Flat $149/week per truck with full back-office, rate negotiations, and detention collection.\n- 7-DAY ZERO RISK FREE TRIAL: Test our desk for 1 full week at $0 cost.\n\nGet started immediately or reply YES to connect with your assigned dispatcher.\n\nBest regards,\nShipping Wish Operations Team\nToll-Free: +1 (800) 580-3101\nhttps://www.shippingwish.com`;
    } else if (val === 'packet') {
      subj.value = 'Carrier Onboarding Packet & Broker Setup — Shipping Wish LLC';
      body.value = `Dear Carrier Partner,\n\nPlease find attached our official Carrier Setup Packet and Dispatch Agreement.\n\nKindly complete and return with:\n1. Copy of FMCSA Operating Authority Certificate (MC/DOT)\n2. Certificate of Insurance (COI) listing minimum $1M Auto Liability and $100k Cargo\n3. Signed W-9 Form\n4. Voided Check or Factoring Notice of Assignment (NOA)\n\nReply directly to this email with your documents or call our operations desk at +1 (800) 580-3101.\n\nShipping Wish LLC Carrier Setup`;
    } else if (val === 'ratecon') {
      subj.value = 'Rate Confirmation & Dispatch Order Verification';
      body.value = `Hello Dispatch,\n\nPlease review and confirm the attached Rate Confirmation for your scheduled load pickup.\n\nAll driver tracking links and pickup location details are verified. Reply to confirm driver contact and ETA.\n\nThank you,\nShipping Wish Logistics`;
    } else if (val === 'loadsnexus') {
      subj.value = 'LoadsNexus™ — Direct Broker Spot Freight ($19/mo Pass)';
      body.value = `Hello Motor Carrier,\n\nDirect access to 4,850+ live verified spot freight loads across all 50 US states.\n\n- Direct unmasked broker phone numbers & dispatch emails.\n- Real Days-To-Pay (DTP) broker credit scores before you book.\n- Zero double-brokering.\n- Starting at only $19/month.\n\nActivate your pass here: https://www.loadsnexus.com\n\nLoadsNexus™ Freight Operations`;
    }
  };

  window.submitComposeEmail = async function (e) {
    e.preventDefault();
    const btn = document.getElementById('btn-send-compose');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    const payload = {
      from: document.getElementById('compose-from').value,
      to: document.getElementById('compose-to').value,
      subject: document.getElementById('compose-subject').value,
      message: document.getElementById('compose-body').value
    };

    try {
      const res = await fetch('/api/email/send-with-attachments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to send email');
      alert(`✅ ${data.message || 'Email sent successfully!'}`);
      closeComposeModal();
      loadInbox(false, 1, 'outbound');
    } catch (err) {
      alert(`⚠️ ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 Send Email Now';
    }
  };

  window.loadInbox = loadInbox;
  window.openMessage = openMessage;
  window.goInboxPage = goInboxPage;
  window.sendReply = sendReply;
  window.trashEmail = trashEmail;
  window.autoResizeIframe = autoResizeIframe;
  window.toggleEmailFormat = toggleEmailFormat;
  window.sanitizeIframeHtml = sanitizeIframeHtml;

  async function init() {
    await checkAuth();
    await loadInbox(false, 1, 'inbound');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<!-- MODAL: COMPOSE EMAIL -->
<div id="modal-compose-email" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:16px;" onclick="closeComposeModal()">
  <div style="background:#ffffff;border-radius:16px;max-width:620px;width:100%;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);overflow:hidden;" onclick="event.stopPropagation()">
    <div style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;background:#f8fafc;">
      <div>
        <h3 style="margin:0;font-size:16px;font-weight:800;color:#0f172a;">✏️ New Email Message</h3>
        <p style="margin:2px 0 0;font-size:12px;color:#64748b;">Send branded dispatch, billing, or load agreement email</p>
      </div>
      <button type="button" onclick="closeComposeModal()" style="border:none;background:none;font-size:18px;cursor:pointer;color:#94a3b8;">✕</button>
    </div>

    <form id="form-compose-email" onsubmit="submitComposeEmail(event)" style="padding:20px;">
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px;text-transform:uppercase;">From Sender Address *</label>
        <select id="compose-from" style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;outline:none;">
          <option value="Shipping Wish Operations <operations@shippingwish.com>">Shipping Wish Operations &lt;operations@shippingwish.com&gt;</option>
          <option value="Shipping Wish Billing <billing@shippingwish.com>">Shipping Wish Billing &lt;billing@shippingwish.com&gt;</option>
          <option value="LoadsNexus Dispatch <dispatch@loadsnexus.com>">LoadsNexus Dispatch &lt;dispatch@loadsnexus.com&gt;</option>
          <option value="LoadsNexus Billing <billing@loadsnexus.com>">LoadsNexus Billing &lt;billing@loadsnexus.com&gt;</option>
        </select>
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px;text-transform:uppercase;">To Recipient Email *</label>
        <input type="email" id="compose-to" required placeholder="e.g. dispatch@carrierfleet.com" style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;outline:none;" />
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px;text-transform:uppercase;">Template Preset</label>
        <select id="compose-tpl" onchange="applyEmailTemplate(this.value)" style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;outline:none;">
          <option value="custom">Custom Message (Blank)</option>
          <option value="trial">Shipping Wish — 7-Day Dedicated Dispatch Free Trial ($0)</option>
          <option value="packet">Carrier Onboarding Packet &amp; Setup</option>
          <option value="ratecon">Rate Confirmation Follow-Up &amp; Dispatch</option>
          <option value="loadsnexus">LoadsNexus™ — $19/mo Unlimited Load Board Pass</option>
        </select>
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px;text-transform:uppercase;">Subject *</label>
        <input type="text" id="compose-subject" required placeholder="Enter email subject..." style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;outline:none;" />
      </div>

      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px;text-transform:uppercase;">Message Body *</label>
        <textarea id="compose-body" required rows="7" placeholder="Type your email message..." style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;line-height:1.5;outline:none;resize:vertical;"></textarea>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e2e8f0;padding-top:14px;">
        <button type="button" class="btn btn-secondary" onclick="closeComposeModal()">Cancel</button>
        <button type="submit" id="btn-send-compose" class="btn btn-primary" style="font-weight:800;">🚀 Send Email Now</button>
      </div>
    </form>
  </div>
</div>
