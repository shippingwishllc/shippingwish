<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad2)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="url(#blueGrad)" stroke-width="10" opacity="0.7"/>

  <!-- Glowing accent dot -->
  <circle cx="405" cy="107" r="24" fill="#3b82f6" filter="url(#glow2)"/>

  <!-- Network / Freight Exchange Icon — simplified truck + route lines -->
  <g transform="translate(72, 130)">
    <!-- Trailer box -->
    <rect x="20" y="80" width="200" height="110" rx="10" fill="url(#blueGrad)" opacity="0.9"/>
    <!-- Cab -->
    <path d="M230,100 L230,190 L305,190 L305,130 L265,80 L230,80 Z" fill="url(#blueGrad)"/>
    <!-- Cab window -->
    <path d="M237,95 L237,130 L298,130 L270,88 Z" fill="#060b14" opacity="0.5"/>
    <!-- Wheels -->
    <circle cx="90" cy="205" r="30" fill="#060b14" stroke="url(#blueGrad)" stroke-width="8"/>
    <circle cx="200" cy="205" r="30" fill="#060b14" stroke="url(#blueGrad)" stroke-width="8"/>
    <circle cx="280" cy="205" r="30" fill="#060b14" stroke="url(#blueGrad)" stroke-width="8"/>
    <!-- Speed lines -->
    <path d="M0,60 L160,60 L145,80 L0,80 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M20,95 L185,95 L170,115 L20,115 Z" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- LN Initials -->
  <text x="256" y="438" font-family="'Inter', 'Outfit', sans-serif" font-weight="900" font-size="78" fill="#ffffff" text-anchor="middle" letter-spacing="4">LOADSNEXUS</text>
</svg>
